apiVersion: templates.domesystems.ai/v1
kind: Template

metadata:
  name: im2nguyen/hello-dome
  version: "0.3.0"
  slug: hello-dome
  title: Hello Dome
  summary: A minimal, runnable chat template for verifying Dome Template Registry publishing.
  source:
    repository: https://github.com/im2nguyen/dome-templates
    path: templates/hello-dome
  ui: chat
  tags:
    domain: productivity
    shape: interactive-assistant
    business_pattern: consumes
    governance_interest: [model-scoped-access]

variables:
  anthropic_api_key:
    sensitive: true
    description: An Anthropic API key.

gateways:
  - name: hello-dome
    description: Gateway for the Hello Dome template.
    is_default: true
    pools: [hello-dome-pool]

models:
  - name: haiku
    provider_id: anthropic
    provider_config: { model: claude-haiku-4-5-20251001 }
    auth_method: api-key
    credential_type: shared
    managed_header_name: x-api-key
    secret_values: { x-api-key: var.anthropic_api_key }

pools:
  - name: hello-dome-pool
    is_default: true
    members: [haiku]

agents:
  - name: hello-dome
    type: managed
    allowed_gateways: [hello-dome]
    system_prompt:
      path: app/instructions.md
    default_model: hello-dome-pool
    trigger_config:
      manual: { enabled: true }
