apiVersion: templates.domesystems.ai/v1
kind: Template

metadata:
  name: im2nguyen/haiku
  version: "0.4.2"
  slug: haiku
  title: Motivational Haiku
  summary: A focused chat agent that turns any challenge into an original motivational haiku.
  source:
    repository: https://github.com/im2nguyen/dome-templates
    path: templates/haiku
  ui: run
  tags:
    domain: productivity
    shape: interactive-assistant
    business_pattern: consumes
    governance_interest: [model-scoped-access]

variables:
  anthropic_api_key:
    sensitive: true
    description: An Anthropic API key.

gateways:
  - name: motivational-haiku
    description: Gateway for the Motivational Haiku template.
    pools: [motivational-haiku-pool]

models:
  - name: haiku
    provider_id: anthropic
    provider_config: { model: claude-haiku-4-5-20251001 }
    auth_method: api-key
    credential_type: shared
    managed_header_name: x-api-key
    secret_values: { x-api-key: var.anthropic_api_key }

pools:
  - name: motivational-haiku-pool
    members: [haiku]

agents:
  - name: motivational-haiku
    type: managed
    gateway: motivational-haiku
    system_prompt:
      path: app/instructions.md
    default_model: motivational-haiku-pool
