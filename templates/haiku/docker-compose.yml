services:
  app:
    image: ghcr.io/dome-systems/runtime-py-chat:dev
    env_file: .env
    volumes:
      - ./app:/config:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
